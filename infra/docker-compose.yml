services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '15432:5432'
    environment:
      POSTGRES_USER: xplorer
      POSTGRES_PASSWORD: xplorer
      POSTGRES_DB: xplorer
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xplorer']
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
