version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    groups:
      tauri:
        patterns: ['@tauri-apps/*']
      testing:
        patterns: ['@testing-library/*', '@vitest/*', 'vitest']
      eslint:
        patterns: ['eslint*', '@eslint/*', '@typescript-eslint/*']
      types:
        patterns: ['@types/*']

  - package-ecosystem: cargo
    directory: /apps/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
