<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="shadowSm" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="tauriGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="560" rx="12" fill="#0a0a1a"/>

  <!-- Tauri Window outer -->
  <rect x="30" y="20" width="640" height="520" rx="14" fill="url(#tauriGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="48" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="500">Tauri Window</text>

  <!-- React Frontend (WebView) -->
  <rect x="60" y="62" width="580" height="200" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="60" y="62" width="580" height="30" rx="10" fill="#1e3a5f"/>
  <rect x="60" y="82" width="580" height="10" fill="#1e3a5f"/>
  <text x="350" y="82" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">React Frontend (WebView)</text>

  <!-- Frontend boxes -->
  <rect x="90" y="104" width="120" height="44" rx="8" fill="#172554" stroke="#2563eb" stroke-width="1" filter="url(#shadowSm)"/>
  <text x="150" y="130" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="500">Pages</text>

  <rect x="230" y="104" width="120" height="44" rx="8" fill="#172554" stroke="#2563eb" stroke-width="1" filter="url(#shadowSm)"/>
  <text x="290" y="130" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="500">Components</text>

  <rect x="370" y="104" width="120" height="44" rx="8" fill="#172554" stroke="#2563eb" stroke-width="1" filter="url(#shadowSm)"/>
  <text x="430" y="130" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="500">Hooks</text>

  <rect x="510" y="104" width="110" height="44" rx="8" fill="#172554" stroke="#2563eb" stroke-width="1" filter="url(#shadowSm)"/>
  <text x="565" y="130" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="500">Contexts</text>

  <!-- Arrows down to TauriAPI -->
  <line x1="150" y1="148" x2="300" y2="172" stroke="#475569" stroke-width="1"/>
  <line x1="290" y1="148" x2="300" y2="172" stroke="#475569" stroke-width="1"/>
  <line x1="430" y1="148" x2="400" y2="172" stroke="#475569" stroke-width="1"/>

  <!-- TauriAPI / transport layer -->
  <rect x="180" y="172" width="340" height="36" rx="8" fill="#1e40af" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadowSm)"/>
  <text x="350" y="195" text-anchor="middle" fill="#dbeafe" font-size="12" font-weight="600" font-family="'Cascadia Code', 'Fira Code', monospace">lib/tauri-api.ts  →  transport()</text>

  <!-- Arrow down to IPC -->
  <line x1="350" y1="208" x2="350" y2="226" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="344,222 350,230 356,222" fill="#fbbf24"/>

  <!-- IPC label -->
  <rect x="200" y="228" width="300" height="28" rx="6" fill="#422006" stroke="#fbbf24" stroke-width="1"/>
  <text x="350" y="247" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="500">IPC Bridge  (invoke / HTTP)</text>

  <!-- Rust Backend -->
  <rect x="60" y="280" width="580" height="240" rx="10" fill="#1c1917" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="60" y="280" width="580" height="30" rx="10" fill="#431407"/>
  <rect x="60" y="300" width="580" height="10" fill="#431407"/>
  <text x="350" y="300" text-anchor="middle" fill="#fed7aa" font-size="13" font-weight="600">Rust Backend</text>

  <!-- Backend module boxes - row 1 -->
  <rect x="90" y="322" width="160" height="44" rx="8" fill="#7c2d12" stroke="#fb923c" stroke-width="1" filter="url(#shadowSm)"/>
  <text x="170" y="340" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="500">File Operations</text>
  <text x="170" y="356" text-anchor="middle" fill="#a8744f" font-size="10">copy, move, rename, delete</text>

  <rect x="270" y="322" width="160" height="44" rx="8" fill="#7c2d12" stroke="#fb923c" stroke-width="1" filter="url(#shadowSm)"/>
  <text x="350" y="340" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="500">AI / Ollama</text>
  <text x="350" y="356" text-anchor="middle" fill="#a8744f" font-size="10">chat, vision, embeddings</text>

  <rect x="450" y="322" width="170" height="44" rx="8" fill="#7c2d12" stroke="#fb923c" stroke-width="1" filter="url(#shadowSm)"/>
  <text x="535" y="340" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="500">SSH / SFTP</text>
  <text x="535" y="356" text-anchor="middle" fill="#a8744f" font-size="10">remote file management</text>

  <!-- Backend module boxes - row 2 -->
  <rect x="90" y="380" width="160" height="44" rx="8" fill="#7c2d12" stroke="#fb923c" stroke-width="1" filter="url(#shadowSm)"/>
  <text x="170" y="398" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="500">Tokenizer / Search</text>
  <text x="170" y="414" text-anchor="middle" fill="#a8744f" font-size="10">index, NL parse, semantic</text>

  <rect x="270" y="380" width="160" height="44" rx="8" fill="#7c2d12" stroke="#fb923c" stroke-width="1" filter="url(#shadowSm)"/>
  <text x="350" y="398" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="500">Git Integration</text>
  <text x="350" y="414" text-anchor="middle" fill="#a8744f" font-size="10">history, blame, branches</text>

  <rect x="450" y="380" width="170" height="44" rx="8" fill="#7c2d12" stroke="#fb923c" stroke-width="1" filter="url(#shadowSm)"/>
  <text x="535" y="398" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="500">Extensions</text>
  <text x="535" y="414" text-anchor="middle" fill="#a8744f" font-size="10">manager, permissions</text>

  <!-- Backend module boxes - row 3 -->
  <rect x="90" y="438" width="160" height="44" rx="8" fill="#7c2d12" stroke="#fb923c" stroke-width="1" filter="url(#shadowSm)"/>
  <text x="170" y="456" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="500">Compression</text>
  <text x="170" y="472" text-anchor="middle" fill="#a8744f" font-size="10">zip, tar, gzip, bzip2, xz</text>

  <rect x="270" y="438" width="160" height="44" rx="8" fill="#7c2d12" stroke="#fb923c" stroke-width="1" filter="url(#shadowSm)"/>
  <text x="350" y="456" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="500">Storage / Tags</text>
  <text x="350" y="472" text-anchor="middle" fill="#a8744f" font-size="10">bookmarks, tags, settings</text>

  <rect x="450" y="438" width="170" height="44" rx="8" fill="#7c2d12" stroke="#fb923c" stroke-width="1" filter="url(#shadowSm)"/>
  <text x="535" y="456" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="500">Shortcuts</text>
  <text x="535" y="472" text-anchor="middle" fill="#a8744f" font-size="10">key bindings, profiles</text>

  <!-- Stats badge -->
  <rect x="90" y="496" width="100" height="20" rx="10" fill="#431407" stroke="#f97316" stroke-width="0.5"/>
  <text x="140" y="510" text-anchor="middle" fill="#fdba74" font-size="10" font-weight="500">276 commands</text>
</svg>
