<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="460" rx="12" fill="#0a0a1a"/>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Backend Module Dependency Graph</text>

  <!-- main.rs root -->
  <rect x="280" y="44" width="140" height="36" rx="8" fill="#7c2d12" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="67" text-anchor="middle" fill="#fed7aa" font-size="13" font-weight="600">main.rs</text>

  <!-- Lines from main to modules -->
  <line x1="310" y1="80" x2="110" y2="108" stroke="#475569" stroke-width="1"/>
  <line x1="330" y1="80" x2="280" y2="108" stroke="#475569" stroke-width="1"/>
  <line x1="350" y1="80" x2="350" y2="108" stroke="#475569" stroke-width="1"/>
  <line x1="370" y1="80" x2="480" y2="108" stroke="#475569" stroke-width="1"/>
  <line x1="390" y1="80" x2="600" y2="108" stroke="#475569" stroke-width="1"/>

  <!-- ═══ Operations module ═══ -->
  <rect x="20" y="108" width="180" height="32" rx="8" fill="#431407" stroke="#f97316" stroke-width="1" filter="url(#shadow)"/>
  <text x="110" y="128" text-anchor="middle" fill="#fed7aa" font-size="11" font-weight="500">operations/</text>

  <!-- Operations children -->
  <line x1="110" y1="140" x2="110" y2="154" stroke="#475569" stroke-width="1"/>

  <rect x="20" y="154" width="86" height="24" rx="5" fill="#1c1917" stroke="#78350f" stroke-width="0.5"/>
  <text x="63" y="170" text-anchor="middle" fill="#fdba74" font-size="9">directory_ops</text>

  <rect x="114" y="154" width="86" height="24" rx="5" fill="#1c1917" stroke="#78350f" stroke-width="0.5"/>
  <text x="157" y="170" text-anchor="middle" fill="#fdba74" font-size="9">file_ops</text>

  <rect x="20" y="184" width="86" height="24" rx="5" fill="#1c1917" stroke="#78350f" stroke-width="0.5"/>
  <text x="63" y="200" text-anchor="middle" fill="#fdba74" font-size="9">trash_ops</text>

  <rect x="114" y="184" width="86" height="24" rx="5" fill="#1c1917" stroke="#78350f" stroke-width="0.5"/>
  <text x="157" y="200" text-anchor="middle" fill="#fdba74" font-size="9">metadata_ops</text>

  <rect x="20" y="214" width="86" height="24" rx="5" fill="#1c1917" stroke="#78350f" stroke-width="0.5"/>
  <text x="63" y="230" text-anchor="middle" fill="#fdba74" font-size="9">compression</text>

  <rect x="114" y="214" width="86" height="24" rx="5" fill="#1c1917" stroke="#78350f" stroke-width="0.5"/>
  <text x="157" y="230" text-anchor="middle" fill="#fdba74" font-size="9">accelerated</text>

  <rect x="20" y="244" width="86" height="24" rx="5" fill="#1c1917" stroke="#78350f" stroke-width="0.5"/>
  <text x="63" y="260" text-anchor="middle" fill="#fdba74" font-size="9">comparison</text>

  <rect x="114" y="244" width="86" height="24" rx="5" fill="#1c1917" stroke="#78350f" stroke-width="0.5"/>
  <text x="157" y="260" text-anchor="middle" fill="#fdba74" font-size="9">system_ops</text>

  <rect x="20" y="274" width="86" height="24" rx="5" fill="#1c1917" stroke="#78350f" stroke-width="0.5"/>
  <text x="63" y="290" text-anchor="middle" fill="#fdba74" font-size="9">properties</text>

  <rect x="114" y="274" width="86" height="24" rx="5" fill="#1c1917" stroke="#78350f" stroke-width="0.5"/>
  <text x="157" y="290" text-anchor="middle" fill="#fdba74" font-size="9">agent_ops</text>

  <!-- ═══ AI module ═══ -->
  <rect x="220" y="108" width="120" height="32" rx="8" fill="#422006" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="280" y="128" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="500">AI / Agent</text>

  <line x1="280" y1="140" x2="280" y2="154" stroke="#475569" stroke-width="1"/>

  <rect x="220" y="154" width="120" height="24" rx="5" fill="#1c1917" stroke="#78350f" stroke-width="0.5"/>
  <text x="280" y="170" text-anchor="middle" fill="#fde68a" font-size="9">ai.rs (Ollama)</text>

  <rect x="220" y="184" width="120" height="24" rx="5" fill="#1c1917" stroke="#78350f" stroke-width="0.5"/>
  <text x="280" y="200" text-anchor="middle" fill="#fde68a" font-size="9">agent.rs (Claude)</text>

  <rect x="220" y="214" width="120" height="24" rx="5" fill="#1c1917" stroke="#78350f" stroke-width="0.5"/>
  <text x="280" y="230" text-anchor="middle" fill="#fde68a" font-size="9">ai_indexer.rs</text>

  <rect x="220" y="244" width="120" height="24" rx="5" fill="#1c1917" stroke="#78350f" stroke-width="0.5"/>
  <text x="280" y="260" text-anchor="middle" fill="#fde68a" font-size="9">vector_store.rs</text>

  <!-- ═══ Search module ═══ -->
  <rect x="350" y="108" width="120" height="32" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1" filter="url(#shadow)"/>
  <text x="410" y="128" text-anchor="middle" fill="#86efac" font-size="11" font-weight="500">Search</text>

  <line x1="410" y1="140" x2="410" y2="154" stroke="#475569" stroke-width="1"/>

  <rect x="350" y="154" width="120" height="24" rx="5" fill="#1c1917" stroke="#14532d" stroke-width="0.5"/>
  <text x="410" y="170" text-anchor="middle" fill="#86efac" font-size="9">tokenizer.rs</text>

  <rect x="350" y="184" width="120" height="24" rx="5" fill="#1c1917" stroke="#14532d" stroke-width="0.5"/>
  <text x="410" y="200" text-anchor="middle" fill="#86efac" font-size="9">doc_extractor.rs</text>

  <!-- ═══ Integrations ═══ -->
  <rect x="480" y="108" width="120" height="32" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
  <text x="540" y="128" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="500">Integrations</text>

  <line x1="540" y1="140" x2="540" y2="154" stroke="#475569" stroke-width="1"/>

  <rect x="480" y="154" width="120" height="24" rx="5" fill="#1c1917" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="540" y="170" text-anchor="middle" fill="#93c5fd" font-size="9">git_history.rs</text>

  <rect x="480" y="184" width="120" height="24" rx="5" fill="#1c1917" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="540" y="200" text-anchor="middle" fill="#93c5fd" font-size="9">ssh/ (35 files)</text>

  <rect x="480" y="214" width="120" height="24" rx="5" fill="#1c1917" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="540" y="230" text-anchor="middle" fill="#93c5fd" font-size="9">google_drive.rs</text>

  <!-- ═══ Extensions & Storage ═══ -->
  <rect x="610" y="108" width="70" height="32" rx="8" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="1" filter="url(#shadow)"/>
  <text x="645" y="128" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="500">Ext</text>

  <line x1="645" y1="140" x2="645" y2="154" stroke="#475569" stroke-width="1"/>

  <rect x="610" y="154" width="70" height="24" rx="5" fill="#1c1917" stroke="#2e1065" stroke-width="0.5"/>
  <text x="645" y="170" text-anchor="middle" fill="#a78bfa" font-size="8">manager</text>

  <rect x="610" y="184" width="70" height="24" rx="5" fill="#1c1917" stroke="#2e1065" stroke-width="0.5"/>
  <text x="645" y="200" text-anchor="middle" fill="#a78bfa" font-size="8">perms</text>

  <rect x="610" y="214" width="70" height="24" rx="5" fill="#1c1917" stroke="#2e1065" stroke-width="0.5"/>
  <text x="645" y="230" text-anchor="middle" fill="#a78bfa" font-size="8">cmds</text>

  <!-- Shared modules at bottom -->
  <rect x="20" y="320" width="660" height="44" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="350" y="340" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="500">Shared Modules</text>

  <rect x="40" y="344" width="100" height="16" rx="4" fill="#1e293b"/>
  <text x="90" y="356" text-anchor="middle" fill="#94a3b8" font-size="8">storage.rs</text>

  <rect x="150" y="344" width="100" height="16" rx="4" fill="#1e293b"/>
  <text x="200" y="356" text-anchor="middle" fill="#94a3b8" font-size="8">shortcuts/</text>

  <rect x="260" y="344" width="100" height="16" rx="4" fill="#1e293b"/>
  <text x="310" y="356" text-anchor="middle" fill="#94a3b8" font-size="8">duplicate_finder</text>

  <rect x="370" y="344" width="110" height="16" rx="4" fill="#1e293b"/>
  <text x="425" y="356" text-anchor="middle" fill="#94a3b8" font-size="8">file_organizer.rs</text>

  <rect x="490" y="344" width="80" height="16" rx="4" fill="#1e293b"/>
  <text x="530" y="356" text-anchor="middle" fill="#94a3b8" font-size="8">watcher.rs</text>

  <rect x="580" y="344" width="80" height="16" rx="4" fill="#1e293b"/>
  <text x="620" y="356" text-anchor="middle" fill="#94a3b8" font-size="8">cleanup.rs</text>

  <!-- Tech stack footer -->
  <text x="350" y="400" text-anchor="middle" fill="#475569" font-size="10">Dependencies: tokio, rayon, crossbeam, chrono, zip 0.6, git2, serde, reqwest</text>

  <!-- Stats -->
  <rect x="240" y="418" width="220" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <text x="350" y="434" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="500">276 registered commands  |  50+ modules</text>
</svg>
