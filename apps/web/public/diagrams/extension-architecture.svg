<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="380" rx="12" fill="#0a0a1a"/>

  <!-- Extension (user code) -->
  <rect x="30" y="24" width="200" height="140" rx="10" fill="#1a0a2e" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="130" y="50" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="600">Your Extension</text>

  <rect x="48" y="62" width="164" height="28" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="130" y="81" text-anchor="middle" fill="#a78bfa" font-size="10" font-family="'Cascadia Code', monospace">Theme.register(colors)</text>

  <rect x="48" y="96" width="164" height="28" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="130" y="115" text-anchor="middle" fill="#a78bfa" font-size="10" font-family="'Cascadia Code', monospace">Sidebar.register(panel)</text>

  <rect x="48" y="130" width="164" height="28" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="130" y="149" text-anchor="middle" fill="#a78bfa" font-size="10" font-family="'Cascadia Code', monospace">Command.register(cmd)</text>

  <!-- Arrow ext → host -->
  <line x1="230" y1="94" x2="268" y2="94" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Extension Host (sandbox) -->
  <rect x="270" y="24" width="180" height="140" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="50" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="600">Extension Host</text>
  <rect x="296" y="56" width="108" height="18" rx="9" fill="#422006" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="350" y="69" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="500">SANDBOXED</text>

  <rect x="288" y="82" width="144" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <text x="360" y="98" text-anchor="middle" fill="#94a3b8" font-size="10">Proxy wrapper</text>

  <rect x="288" y="112" width="144" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <text x="360" y="128" text-anchor="middle" fill="#94a3b8" font-size="10">Blocked globals</text>

  <rect x="288" y="142" width="144" height="18" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <text x="360" y="155" text-anchor="middle" fill="#64748b" font-size="9">fetch, eval, __TAURI__</text>

  <!-- Arrow host → API -->
  <line x1="450" y1="94" x2="488" y2="94" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Xplorer SDK API -->
  <rect x="490" y="24" width="160" height="140" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="50" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">XplorerSDK</text>

  <rect x="506" y="62" width="128" height="24" rx="6" fill="#1e3a5f" stroke="#2563eb" stroke-width="0.5"/>
  <text x="570" y="78" text-anchor="middle" fill="#bfdbfe" font-size="10">files, ui, navigation</text>

  <rect x="506" y="92" width="128" height="24" rx="6" fill="#1e3a5f" stroke="#2563eb" stroke-width="0.5"/>
  <text x="570" y="108" text-anchor="middle" fill="#bfdbfe" font-size="10">settings, commands</text>

  <rect x="506" y="122" width="128" height="24" rx="6" fill="#1e3a5f" stroke="#2563eb" stroke-width="0.5"/>
  <text x="570" y="138" text-anchor="middle" fill="#bfdbfe" font-size="10">React hooks + UI</text>

  <!-- Lifecycle row -->
  <rect x="30" y="190" width="620" height="56" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="340" y="212" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Extension Lifecycle</text>

  <!-- Lifecycle steps -->
  <rect x="50" y="220" width="70" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <text x="85" y="234" text-anchor="middle" fill="#94a3b8" font-size="9">Install</text>

  <text x="132" y="234" fill="#475569" font-size="14">&#x2192;</text>

  <rect x="148" y="220" width="60" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <text x="178" y="234" text-anchor="middle" fill="#94a3b8" font-size="9">Load</text>

  <text x="222" y="234" fill="#475569" font-size="14">&#x2192;</text>

  <rect x="238" y="220" width="74" height="20" rx="4" fill="#172554" stroke="#3b82f6" stroke-width="0.5"/>
  <text x="275" y="234" text-anchor="middle" fill="#93c5fd" font-size="9">Activate</text>

  <text x="326" y="234" fill="#475569" font-size="14">&#x2192;</text>

  <rect x="340" y="220" width="74" height="20" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="0.5"/>
  <text x="377" y="234" text-anchor="middle" fill="#86efac" font-size="9" font-weight="500">Running</text>

  <text x="428" y="234" fill="#475569" font-size="14">&#x2192;</text>

  <rect x="444" y="220" width="84" height="20" rx="4" fill="#422006" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="486" y="234" text-anchor="middle" fill="#fde68a" font-size="9">Deactivate</text>

  <text x="542" y="234" fill="#475569" font-size="14">&#x2192;</text>

  <rect x="558" y="220" width="72" height="20" rx="4" fill="#1c1917" stroke="#f97316" stroke-width="0.5"/>
  <text x="594" y="234" text-anchor="middle" fill="#fdba74" font-size="9">Uninstall</text>

  <!-- Capabilities row -->
  <text x="340" y="278" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Extension Capabilities</text>

  <rect x="30" y="290" width="95" height="36" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
  <text x="78" y="312" text-anchor="middle" fill="#93c5fd" font-size="10">Panels</text>

  <rect x="135" y="290" width="95" height="36" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
  <text x="183" y="312" text-anchor="middle" fill="#93c5fd" font-size="10">Themes</text>

  <rect x="240" y="290" width="95" height="36" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
  <text x="288" y="312" text-anchor="middle" fill="#93c5fd" font-size="10">Previews</text>

  <rect x="345" y="290" width="95" height="36" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
  <text x="393" y="312" text-anchor="middle" fill="#93c5fd" font-size="10">Commands</text>

  <rect x="450" y="290" width="95" height="36" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
  <text x="498" y="312" text-anchor="middle" fill="#93c5fd" font-size="10">Menus</text>

  <rect x="555" y="290" width="95" height="36" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
  <text x="603" y="312" text-anchor="middle" fill="#93c5fd" font-size="10">Decorators</text>

  <!-- Permission note -->
  <rect x="30" y="340" width="620" height="30" rx="8" fill="#1c1917" stroke="#475569" stroke-width="0.5"/>
  <text x="340" y="360" text-anchor="middle" fill="#94a3b8" font-size="11">All extensions run with permission-scoped access: file system, UI, system, and Xplorer APIs</text>
</svg>
