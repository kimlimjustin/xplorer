<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060510"/>
      <stop offset="100%" style="stop-color:#110d24"/>
    </linearGradient>
    <linearGradient id="face16a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c7d2fe"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="face16b" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#3730a3"/>
    </linearGradient>
    <linearGradient id="face16c" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4338ca"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="face16d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a5b4fc"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="accent16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="origamiglow">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg16)"/>
  <!-- Abstract origami / folded paper shape — a document folding open -->
  <g filter="url(#origamiglow)">
    <!-- Left face (folded back) -->
    <polygon points="100,256 256,120 256,256" fill="url(#face16b)"/>
    <!-- Right face (folded forward, brighter) -->
    <polygon points="412,256 256,120 256,256" fill="url(#face16a)"/>
    <!-- Bottom-left face -->
    <polygon points="100,256 256,392 256,256" fill="url(#face16c)"/>
    <!-- Bottom-right face (darkest) -->
    <polygon points="412,256 256,392 256,256" fill="url(#face16b)" opacity="0.7"/>
    <!-- Fold crease lines -->
    <line x1="100" y1="256" x2="412" y2="256" stroke="white" stroke-width="1" opacity="0.2"/>
    <line x1="256" y1="120" x2="256" y2="392" stroke="white" stroke-width="1" opacity="0.15"/>
    <!-- Edge highlights -->
    <line x1="256" y1="120" x2="412" y2="256" stroke="white" stroke-width="1.5" opacity="0.25"/>
    <line x1="256" y1="120" x2="100" y2="256" stroke="white" stroke-width="1" opacity="0.15"/>
  </g>
  <!-- Subtle inner detail — abstract text on the right face -->
  <line x1="290" y1="175" x2="370" y2="220" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.1"/>
  <line x1="282" y1="190" x2="345" y2="225" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.08"/>
  <!-- Cyan accent dot — where the fold meets -->
  <circle cx="256" cy="256" r="6" fill="#22d3ee" opacity="0.7"/>
  <circle cx="256" cy="256" r="14" fill="#22d3ee" opacity="0.1"/>
</svg>
