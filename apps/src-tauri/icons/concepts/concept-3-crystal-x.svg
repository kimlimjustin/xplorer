<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="face3a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a5b4fc"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="face3b" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="face3c" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3730a3"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="face3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c7d2fe"/>
      <stop offset="100%" style="stop-color:#a5b4fc"/>
    </linearGradient>
    <linearGradient id="folder3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <filter id="crystalglow">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#818cf8" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg3)"/>
  <!-- Folder silhouette behind the crystal — gives file explorer context -->
  <g opacity="0.2">
    <path d="M100 190 L100 165 Q100 148 118 148 L205 148 Q218 148 224 163 L236 190 Z" fill="url(#folder3)"/>
    <rect x="84" y="190" width="344" height="210" rx="18" fill="url(#folder3)"/>
  </g>
  <!-- Crystal X - faceted gem look, sits on the folder -->
  <g filter="url(#crystalglow)">
    <polygon points="155,165 215,165 256,250 225,270" fill="url(#face3a)"/>
    <polygon points="155,165 225,270 192,270 130,198" fill="url(#face3b)"/>
    <polygon points="357,165 297,165 256,250 287,270" fill="url(#face3b)"/>
    <polygon points="357,165 287,270 320,270 382,198" fill="url(#face3c)"/>
    <polygon points="155,375 215,375 256,290 225,270" fill="url(#face3c)"/>
    <polygon points="155,375 225,270 192,270 130,342" fill="url(#face3a)" opacity="0.8"/>
    <polygon points="357,375 297,375 256,290 287,270" fill="url(#face3a)" opacity="0.8"/>
    <polygon points="357,375 287,270 320,270 382,342" fill="url(#face3b)" opacity="0.8"/>
    <polygon points="256,250 287,270 256,290 225,270" fill="url(#face3d)"/>
  </g>
  <!-- Edge highlights -->
  <line x1="256" y1="250" x2="256" y2="290" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="225" y1="270" x2="287" y2="270" stroke="white" stroke-width="1" opacity="0.3"/>
  <!-- Tiny floating file pages around the crystal -->
  <g opacity="0.35">
    <rect x="380" y="140" width="18" height="24" rx="2" fill="#818cf8"/>
    <polyline points="389,140 389,148 398,148" fill="none" stroke="#c7d2fe" stroke-width="1"/>
  </g>
  <g opacity="0.25">
    <rect x="96" y="385" width="16" height="22" rx="2" fill="#818cf8"/>
    <polyline points="104,385 104,392 112,392" fill="none" stroke="#c7d2fe" stroke-width="1"/>
  </g>
  <g opacity="0.3">
    <rect x="400" y="370" width="14" height="20" rx="2" fill="#818cf8"/>
  </g>
</svg>
