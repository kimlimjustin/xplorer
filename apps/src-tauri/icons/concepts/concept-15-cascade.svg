<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06050f"/>
      <stop offset="100%" style="stop-color:#0d0a1e"/>
    </linearGradient>
    <linearGradient id="card15a" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#4c1d95;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="card15b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.45"/>
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="card15c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#164e63;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="card15d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a5b4fc;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.25"/>
    </linearGradient>
    <filter id="cardglow15">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg15)"/>
  <!-- Cascading cards — like windows/files cascading in 3D perspective -->
  <g filter="url(#cardglow15)">
    <!-- Card 4 (back) -->
    <rect x="80" y="100" width="240" height="300" rx="14" fill="url(#card15a)"/>
    <rect x="80" y="100" width="240" height="300" rx="14" fill="none" stroke="#7c3aed" stroke-width="1.2" opacity="0.3"/>
    <line x1="80" y1="132" x2="320" y2="132" stroke="#7c3aed" stroke-width="0.8" opacity="0.25"/>
    <!-- Title bar dots -->
    <circle cx="100" cy="116" r="4" fill="#7c3aed" opacity="0.4"/>
    <circle cx="114" cy="116" r="4" fill="#7c3aed" opacity="0.3"/>
    <circle cx="128" cy="116" r="4" fill="#7c3aed" opacity="0.2"/>

    <!-- Card 3 -->
    <rect x="130" y="120" width="240" height="300" rx="14" fill="url(#card15b)"/>
    <rect x="130" y="120" width="240" height="300" rx="14" fill="none" stroke="#4f46e5" stroke-width="1.3" opacity="0.35"/>
    <line x1="130" y1="152" x2="370" y2="152" stroke="#4f46e5" stroke-width="0.8" opacity="0.3"/>
    <circle cx="150" cy="136" r="4" fill="#4f46e5" opacity="0.5"/>
    <circle cx="164" cy="136" r="4" fill="#4f46e5" opacity="0.35"/>
    <circle cx="178" cy="136" r="4" fill="#4f46e5" opacity="0.25"/>

    <!-- Card 2 -->
    <rect x="185" y="140" width="240" height="300" rx="14" fill="url(#card15c)"/>
    <rect x="185" y="140" width="240" height="300" rx="14" fill="none" stroke="#0891b2" stroke-width="1.4" opacity="0.4"/>
    <line x1="185" y1="172" x2="425" y2="172" stroke="#0891b2" stroke-width="0.8" opacity="0.3"/>
    <circle cx="205" cy="156" r="4" fill="#22d3ee" opacity="0.5"/>
    <circle cx="219" cy="156" r="4" fill="#22d3ee" opacity="0.35"/>
    <circle cx="233" cy="156" r="4" fill="#22d3ee" opacity="0.25"/>
    <!-- Content lines -->
    <line x1="205" y1="195" x2="360" y2="195" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity="0.2"/>
    <line x1="205" y1="218" x2="320" y2="218" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity="0.15"/>

    <!-- Card 1 (front, most visible) -->
    <rect x="240" y="160" width="240" height="300" rx="14" fill="url(#card15d)"/>
    <rect x="240" y="160" width="240" height="300" rx="14" fill="none" stroke="#a5b4fc" stroke-width="1.5" opacity="0.5"/>
    <line x1="240" y1="192" x2="480" y2="192" stroke="#a5b4fc" stroke-width="0.8" opacity="0.35"/>
    <!-- Top highlight -->
    <line x1="254" y1="161" x2="466" y2="161" stroke="white" stroke-width="0.8" opacity="0.2"/>
    <!-- Title bar dots -->
    <circle cx="260" cy="176" r="4.5" fill="#e0e7ff" opacity="0.6"/>
    <circle cx="276" cy="176" r="4.5" fill="#e0e7ff" opacity="0.4"/>
    <circle cx="292" cy="176" r="4.5" fill="#e0e7ff" opacity="0.3"/>
    <!-- Content lines -->
    <line x1="262" y1="218" x2="440" y2="218" stroke="#6366f1" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
    <line x1="262" y1="245" x2="390" y2="245" stroke="#6366f1" stroke-width="4" stroke-linecap="round" opacity="0.25"/>
    <line x1="262" y1="272" x2="420" y2="272" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.2"/>
    <line x1="262" y1="299" x2="370" y2="299" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
    <!-- Thumbnail block -->
    <rect x="262" y="320" width="80" height="60" rx="6" fill="#4f46e5" opacity="0.2"/>
    <rect x="356" y="320" width="80" height="60" rx="6" fill="#4f46e5" opacity="0.15"/>
  </g>
</svg>
