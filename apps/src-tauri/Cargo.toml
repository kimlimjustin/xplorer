[package]
name = "xplorer"
version = "0.1.0"
description = "A modern file explorer built with Tauri"
authors = ["Justin Maximillian Kimlim"]
license = "AGPL-3.0"
repository = "https://github.com/kimlimjustin/xplorer"
edition = "2021"
default-run = "xplorer"

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
tauri = { version = "2.10.2", features = ["protocol-asset"] }
tauri-plugin-fs = "2.4.5"
tauri-plugin-global-shortcut = "2.3.0"
tauri-plugin-dialog = "2.4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }
glob = "0.3"
zip = "0.6"
tar = "0.4.45"
flate2 = "1.0"
bzip2 = "0.4"
xz2 = "0.1"
sha2 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
ollama-rs = "0.3.2"
trash = "5.1"
dirs = "5.0"
base64 = "0.22"
rand = "0.8"
regex = "1.0"
pdf-extract = "0.7"
dotenvy = "0.15"
rayon = "1.8"
memmap2 = "0.9"
crossbeam = "0.8"
dashmap = "6"
num_cpus = "1.16"
libloading = "0.8"
hostname = "0.4"
futures-util = "0.3"
walkdir = "2.5"
ignore = "0.4"
jwalk = "0.8"
tauri-plugin-drag = "2.1.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
notify = "7"
rust-stemmers = "1.2"
rustc-hash = "2"
fst = { version = "0.4", features = ["levenshtein"] }
roaring = "0.10"
notify-debouncer-full = "0.4"
image = "0.25"
git2 = "0.19"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
bincode = "1.3"
rusqlite = { version = "0.31", features = ["bundled"] }
sevenz-rust2 = { version = "0.20", features = ["compress", "util"] }
unrar = "0.5"
wasmi = "0.40"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
portable-pty = "0.8"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"

[[bin]]
name = "xplorer"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[features]
custom-protocol = ["tauri/custom-protocol"]
